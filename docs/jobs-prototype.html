<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>TIN Jobs Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Staatliches&family=Instrument+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&family=Tiro+Devanagari+Hindi&display=swap">
<style>
/* Layout: a dark "launch corridor" — warp-field hero, two equal lanes (Professional steel / Skilled amber), then role dashboards that share one data model. */
:root{
  --ink:#0E0D10; --panel:#17151A; --panel2:#1F1C23; --line:#2E2A33; --fg:#F4F1EE; --mute:#A7A1AB; --dim:#746E7A;
  --red:#E01B33; --redDeep:#C10322; --pro:#A9C2E2; --skill:#F3AE45; --ok:#5BC98A; --warn:#F3AE45; --bad:#E86A6A;
  --display:'Staatliches',Impact,'Arial Narrow',sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Fira Code',ui-monospace,Menlo,Consolas,monospace;
  --hindi:'Tiro Devanagari Hindi','Noto Sans Devanagari',serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;line-height:.95;margin:0;text-wrap:balance}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--mute)} .dim{color:var(--dim)}

/* NAV */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--ink) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:16px;height:62px}
.logo{display:flex;align-items:baseline;gap:8px;text-decoration:none;flex-shrink:0}
.logo b{font-family:var(--display);font-weight:400;font-size:34px;color:var(--red);line-height:1;letter-spacing:.02em}
.logo span{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg)}
.navlinks{display:flex;gap:2px;margin-left:8px}
.navlinks a{text-decoration:none;font-size:14px;color:var(--mute);padding:7px 11px;border-radius:999px;transition:color .2s,background .2s}
.navlinks a:hover{color:var(--fg)}
.navlinks a.on{color:var(--fg);background:var(--panel2)}
.navcta{margin-left:auto;display:flex;gap:8px;align-items:center}
.who{display:flex;align-items:center;gap:6px;border:1px dashed var(--line);border-radius:999px;padding:3px 4px 3px 10px}
.who span{font-family:var(--mono);font-size:10.5px;color:var(--dim);white-space:nowrap}
.who select{background:var(--panel);border:0;border-radius:999px;padding:5px 8px;font-size:12.5px;max-width:170px}
.bell{position:relative}
.bell i{position:absolute;top:-3px;right:-3px;background:var(--red);color:#fff;font-style:normal;font-size:10.5px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-family:var(--mono)}
@media (max-width:980px){.navlinks{display:none}}
@media (max-width:640px){.who span{display:none}.navcta .hide-sm{display:none}.nav .wrap{gap:8px}.logo span{display:none}.who select{max-width:112px}.navcta .btn{padding:8px 11px;font-size:13px}.navcta{gap:6px;min-width:0}}
@media (max-width:440px){.navcta .bell{display:none}}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;text-decoration:none;transition:transform .15s,background .2s,border-color .2s;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--mute)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover:not(:disabled){background:var(--redDeep)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.big{padding:16px 26px;font-size:16px}
.btn.warn{border-color:color-mix(in srgb,var(--bad) 60%,var(--line));color:var(--bad)}
.btn .arr{transition:transform .25s}
.btn:hover .arr{transform:translateX(4px)}
.linkbtn{background:none;border:0;padding:0;color:var(--fg);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--dim)}
.linkbtn:hover{text-decoration-color:var(--red)}

/* HERO */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
#warp{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 80% at 30% 55%,transparent 0%,var(--ink) 85%);pointer-events:none}
.hero .wrap{position:relative;z-index:2;padding-block:72px 56px}
.hero h1{font-size:clamp(56px,10.5vw,148px);line-height:.86;max-width:12ch}
.hero h1 .ln{display:block;overflow:hidden}
.hero h1 .ln span{display:inline-block;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.hero h1 .ln:nth-child(2) span{animation-delay:.12s;color:var(--red)}
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
.hero .sub{margin-top:22px;font-size:clamp(16px,1.7vw,19px);color:var(--mute);max-width:52ch}
.hero .ctas{margin-top:30px;display:flex;gap:12px;flex-wrap:wrap}
.tick{margin-top:44px;display:flex;flex-wrap:wrap;gap:10px 28px;font-family:var(--mono);font-size:12.5px;color:var(--mute)}
.tick b{color:var(--fg);font-weight:500}
.livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}100%{box-shadow:0 0 0 8px transparent}}

section.blk{padding-block:72px}
.sh{display:flex;align-items:end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.sh h2{font-size:clamp(38px,5.4vw,64px)}
.sh p{color:var(--mute);max-width:46ch}
.sh.sm h2{font-size:34px}

/* LANES */
.lanes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.lanes{grid-template-columns:1fr}}
.lane{position:relative;overflow:hidden;border-radius:22px;padding:30px;min-height:380px;display:flex;flex-direction:column;gap:18px;text-decoration:none;border:1px solid var(--line);background:var(--panel);transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s}
.lane:hover{transform:translateY(-4px)}
.lane.pro:hover{border-color:var(--pro)} .lane.skill:hover{border-color:var(--skill)}
.lane canvas{position:absolute;right:0;top:0;width:65%;height:100%;opacity:.55;pointer-events:none}
.lane .tag{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase}
.lane.pro .tag{color:var(--pro)} .lane.skill .tag{color:var(--skill)}
.lane h3{font-size:clamp(40px,4.6vw,60px);max-width:9ch;position:relative}
.lane .roles{display:flex;flex-wrap:wrap;gap:6px;position:relative;margin-top:auto}
.lane .roles span{font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--ink);border:1px solid var(--line);color:var(--mute)}
.lane .foot{display:flex;justify-content:space-between;align-items:center;position:relative;font-family:var(--mono);font-size:13px}
.lane.pro .foot b{color:var(--pro)} .lane.skill .foot b{color:var(--skill)}
.lane .hi{font-family:var(--hindi);font-size:15px;color:var(--skill);position:relative}

.inds{display:flex;flex-wrap:wrap;gap:8px}
.ind{display:flex;align-items:center;gap:10px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);transition:border-color .2s;font-size:14.5px}
.ind:hover{border-color:var(--red)}
.ind .c{font-family:var(--mono);font-size:12px;color:var(--dim)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.fn{padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline;transition:background .2s;background:transparent;border-top:0;border-left:0;text-align:left;font-size:14px}
.fn:hover{background:var(--panel2)}
.fn .i{font-family:var(--mono);font-size:11px;color:var(--dim);flex-shrink:0;width:20px}
.fn:hover .i{color:var(--red)}

/* JOB ROWS */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:13.5px;color:var(--mute);white-space:nowrap}
.tab.on{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.tab i{font-style:normal;font-family:var(--mono);font-size:11.5px;margin-left:6px;opacity:.7}
.jobs{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.job{display:grid;grid-template-columns:6px minmax(0,2.2fr) minmax(0,1.3fr) minmax(0,1.1fr) auto;gap:18px;align-items:center;padding:18px 4px;border-bottom:1px solid var(--line);transition:background .2s,padding .25s;text-align:left;background:transparent;border-left:0;border-right:0;border-top:0;width:100%}
.job:hover{background:var(--panel);padding-left:12px}
.job .bar{width:4px;height:38px;border-radius:2px}
.job.pro .bar{background:var(--pro)} .job.skill .bar{background:var(--skill)}
.job .t{font-weight:600;font-size:16px}
.job .o{font-size:13px;color:var(--mute)}
.job .m{font-size:13px;color:var(--mute);min-width:0}
.job .pay{font-family:var(--mono);font-size:13px;text-align:right;white-space:nowrap}
.chip{display:inline-block;font-size:11.5px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mute);margin:2px 4px 2px 0;white-space:nowrap}
.chip.urg{border-color:var(--red);color:#fff;background:color-mix(in srgb,var(--red) 30%,transparent)}
.chip.evp{border-color:color-mix(in srgb,var(--ok) 55%,var(--line));color:var(--ok)}
@media (max-width:760px){.job{grid-template-columns:6px minmax(0,1fr);gap:4px 12px}.job .bar{grid-row:span 4;height:100%}.job .pay{text-align:left}}

/* STATUS PILLS */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid;white-space:nowrap;font-weight:500}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.g{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.pill.w{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.pill.n{color:var(--pro);border-color:color-mix(in srgb,var(--pro) 40%,transparent)}
.pill.e{color:var(--mute);border-color:var(--line)}
.pill.b{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}

/* FLEX BOARD */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ticket{border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--panel);display:flex;flex-direction:column;gap:10px;transition:transform .25s,border-color .25s;text-align:left}
.ticket:hover{transform:translateY(-3px);border-color:var(--skill)}
.ticket .count{font-family:var(--display);font-size:54px;line-height:.85}
.ticket .count small{font-family:var(--mono);font-size:12px;color:var(--mute);margin-left:6px}
.ticket .rate{font-family:var(--mono);font-size:14px;color:var(--skill)}
.ticket .meta{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin:0}
.ticket .meta dt{color:var(--dim);font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.ticket .meta dd{margin:0}
.perf{border-top:1px dashed var(--line);margin:0 -18px;padding:10px 18px 0;display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--dim)}

.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.plate{border:1px solid var(--line);border-radius:22px;padding:28px;background:var(--panel);display:flex;flex-direction:column;gap:16px;min-width:0}
.plate h3{font-size:38px}
.path{display:flex;align-items:center;flex-wrap:wrap;font-size:13.5px;row-gap:6px}
.path span{padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--ink)}
.path i{width:18px;height:1px;background:var(--red);display:inline-block}
.pts{display:flex;flex-direction:column;gap:14px}
.pt{display:grid;grid-template-columns:28px 1fr;gap:10px}
.pt .k{font-family:var(--mono);color:var(--red);font-size:13px;padding-top:2px}
.pt b{display:block;font-weight:600}
.pt p{color:var(--mute);font-size:14px}
.price{display:flex;gap:10px;flex-wrap:wrap}
.price div{flex:1;min-width:140px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--ink)}
.price b{font-family:var(--display);font-size:34px;font-weight:400;display:block;line-height:1}
.price s{color:var(--dim);font-family:var(--mono);font-size:12px}
.eco{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.eco{grid-template-columns:1fr}}
.eco a{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 22px;border:1px solid var(--line);border-radius:16px;text-decoration:none;transition:border-color .2s}
.eco a:hover{border-color:var(--mute)}
.eco b{font-family:var(--display);font-weight:400;font-size:30px;display:block}
.eco p{color:var(--mute);font-size:13.5px}

footer{border-top:1px solid var(--line);padding-block:40px;color:var(--dim);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
footer .logo b{font-size:26px}

.view{animation:viewin .45s cubic-bezier(.2,.8,.2,1)}
@keyframes viewin{from{opacity:.4;transform:translateY(10px)}to{opacity:1;transform:none}}
.vhead{padding-block:44px 26px;border-bottom:1px solid var(--line)}
.vhead h1{font-size:clamp(46px,7vw,90px)}
.vhead p.lead{color:var(--mute);margin-top:12px;max-width:62ch}
.vhead .crumb{margin-bottom:14px}
.vhead .crumb a{color:var(--mute);text-decoration:none}
.vhead .tabs{margin-top:22px}
.lanehead.pro h1 em{color:var(--pro);font-style:normal}
.lanehead.skill h1 em{color:var(--skill);font-style:normal}

.lay{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;padding-block:28px 80px}
@media (max-width:860px){.lay{grid-template-columns:1fr;gap:18px}}
.side{display:flex;flex-direction:column;gap:16px}
.side label,.lab{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mute);font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em}
.in{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;font-family:var(--body);text-transform:none;letter-spacing:0;color:var(--fg)}
textarea.in{min-height:90px;resize:vertical}
.in:focus{outline:none;border-color:var(--red)}
.in.sm{padding:6px 9px;font-size:13px;width:auto}
.count{font-family:var(--mono);font-size:12.5px;color:var(--mute);margin-bottom:10px}

.trades{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:24px}
.trade{padding:16px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);text-align:left;min-height:88px;display:flex;flex-direction:column;justify-content:space-between;transition:border-color .2s,background .2s}
.trade:hover,.trade.on{border-color:var(--skill)}
.trade.on{background:color-mix(in srgb,var(--skill) 14%,var(--panel))}
.trade b{font-size:15.5px;font-weight:600}
.trade .hi{font-family:var(--hindi);color:var(--skill);font-size:15px}
.trade small{font-family:var(--mono);font-size:11px;color:var(--dim)}

/* WIZARD */
.wiz{display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px;padding-block:32px 90px}
@media (max-width:860px){.wiz{grid-template-columns:1fr;gap:20px}}
.steps{display:flex;flex-direction:column;gap:2px;position:sticky;top:84px;align-self:start}
@media (max-width:860px){.steps{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}}
.step{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;font-size:14px;color:var(--dim);background:transparent;border:0;text-align:left;white-space:nowrap}
.step .n{font-family:var(--mono);font-size:12px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex-shrink:0}
.step.on{color:var(--fg);background:var(--panel)}
.step.on .n{border-color:var(--red);color:var(--red)}
.step.done{color:var(--mute)}
.step.done .n{background:var(--red);border-color:var(--red);color:#fff}
.pane{display:flex;flex-direction:column;gap:22px;max-width:720px;min-width:0}
.pane h2{font-size:44px}
.pane .lede{color:var(--mute);margin-top:-12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:7px;min-width:0}
.f > span{font-size:13px;font-weight:600}
.f > span em{font-style:normal;color:var(--dim);font-weight:400}
.f .hint{font-size:12.5px;color:var(--dim)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13.5px;color:var(--mute);transition:all .15s}
.pick button:hover{border-color:var(--mute);color:var(--fg)}
.pick button.on{background:var(--fg);border-color:var(--fg);color:var(--ink)}
.pick.skillp button.on{background:var(--skill);border-color:var(--skill)}
.pick.prop button.on{background:var(--pro);border-color:var(--pro)}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.choose{grid-template-columns:1fr}}
.opt{padding:18px;border-radius:16px;border:1px solid var(--line);background:var(--panel);text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .2s}
.opt b{font-family:var(--display);font-weight:400;font-size:26px}
.opt p{font-size:13.5px;color:var(--mute)}
.opt.on.pro{border-color:var(--pro)} .opt.on.skill{border-color:var(--skill)} .opt.on.plain{border-color:var(--red)}
.callout{border-left:3px solid var(--red);padding:14px 16px;background:var(--panel);border-radius:0 12px 12px 0;font-size:14px;color:var(--mute)}
.callout b{color:var(--fg)}
.callout.ok{border-left-color:var(--ok)}
.benefits{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ben{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.ben:last-child{border-bottom:0}
.ben input[type=checkbox]{width:18px;height:18px;accent-color:var(--red)}
.ben label{font-size:14px;cursor:pointer}
.ben .in{grid-column:2;padding:8px 10px;font-size:13.5px}
.nav2{display:flex;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}

/* ================= CAREER SCORE (deterministic) ================= */
function readiness(c,gi){
  const g=c.career.goals[gi];if(!g)return{total:0,parts:[]};
  const lv=s=>(c.skills[s]||0)/2,parts=[];
  parts.push({k:"edu",l:"Education",w:W.edu,f:Math.min(1,(c.edu+1)/(g.edu+1)),d:`${EDU[c.edu]} · role asks for ${EDU[g.edu]}`});
  parts.push({k:"exp",l:"Relevant experience",w:W.exp,f:Math.min(1,c.exp/g.exp),d:`${c.exp} of ${g.exp} years`});
  ["functional","technical","management","industry"].forEach(cat=>{const rs=g.reqs.filter(r=>r[1]===cat);if(!rs.length)return;const f=rs.reduce((s,r)=>s+lv(r[0]),0)/rs.length;
    parts.push({k:cat,l:CAT_L[cat],w:W[cat],f,d:`${rs.filter(r=>lv(r[0])===1).length} in place, ${rs.filter(r=>lv(r[0])===.5).length} developing, ${rs.filter(r=>!lv(r[0])).length} to learn`})});
  if(g.certs.length){const q=g.certs.map(n=>c.career.quals[n]||"not_started");parts.push({k:"certs",l:"Certifications",w:W.certs,f:q.reduce((s,x)=>s+(x==="completed"?1:x==="in_progress"?.5:0),0)/q.length,d:`${q.filter(x=>x==="completed").length} of ${q.length} completed`})}
  if(g.exposure.length){const n=g.exposure.filter(x=>c.career.exposure[x]).length;parts.push({k:"exposure",l:"Project & role exposure",w:W.exposure,f:n/g.exposure.length,d:`${n} of ${g.exposure.length} done`})}
  const since=Date.now()-3*365*DAY,lg=c.career.log.filter(x=>x.at>since),pr=lg.filter(x=>x.type==="Promotion").length+.5*lg.filter(x=>x.type==="New responsibility").length;
  parts.push({k:"prog",l:"Career progression",w:W.prog,f:Math.min(1,pr/2),d:`${pr} in the last 3 years (2 = full marks)`});
  const tw=parts.reduce((s,p)=>s+p.w,0),tot=Math.round(parts.reduce((s,p)=>s+p.w*p.f,0)/tw*100);
  return{total:tot,parts,tw};
}
function nextGoal(c){const gs=c.career.goals;for(let i=0;i<gs.length;i++)if(readiness(c,i).total<100)return i;return gs.length-1}
function careerScore(c){return c.career.goals.length?readiness(c,nextGoal(c)).total:0}
function snap(c){const v=careerScore(c),s=c.career.scores,l=s[s.length-1];if(l&&new Date(l.at).toDateString()===new Date().toDateString())l.v=v;else s.push({at:Date.now(),v})}
function completion(c){const f=[c.name,c.phone,c.loc,c.role,c.exp,c.eduText||c.edu,Object.keys(c.skills).length,c.history.length,c.cv,c.prefs.length,c.career.goals.length];return pct(f.filter(Boolean).length,f.length)}

/* ================= VISUALS ================= */
let warpStop=null,stops=[];
function warp(canvas,{color="#E01B33",alt="#F4F1EE",density=140,cx=.72,cy=.5}={}){
  const ctx=canvas.getContext("2d");let w,h,dpr,stars=[],raf;
  function size(){dpr=Math.min(devicePixelRatio||1,2);w=canvas.clientWidth;h=canvas.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  function seedS(s){s.a=Math.random()*Math.PI*2;s.d=Math.random()*20+2;s.v=Math.random()*.012+.004;s.c=Math.random()<.18?color:alt;s.o=Math.random()*.5+.2;return s}
  size();for(let i=0;i<density;i++){const s=seedS({});s.d=Math.random()*Math.max(w,h);stars.push(s)}
  function frame(step){ctx.clearRect(0,0,w,h);const ox=w*cx,oy=h*cy,max=Math.hypot(w,h);
    for(const s of stars){if(step)s.d*=1+s.v*1.6+.004;if(s.d>max)seedS(s);const len=Math.min(s.d*.18,90);
      ctx.strokeStyle=s.c;ctx.globalAlpha=s.o*Math.min(1,s.d/140);ctx.lineWidth=s.c===color?1.6:1;ctx.beginPath();ctx.moveTo(ox+Math.cos(s.a)*(s.d-len),oy+Math.sin(s.a)*(s.d-len));ctx.lineTo(ox+Math.cos(s.a)*s.d,oy+Math.sin(s.a)*s.d);ctx.stroke()}
    ctx.globalAlpha=1}
  function loop(){frame(true);raf=requestAnimationFrame(loop)}
  const io=new IntersectionObserver(e=>{cancelAnimationFrame(raf);if(e[0].isIntersecting&&!RM)loop()});io.observe(canvas);
  if(RM)frame(false);else loop();const onR=()=>{size();frame(false)};addEventListener("resize",onR);
  return()=>{cancelAnimationFrame(raf);io.disconnect();removeEventListener("resize",onR)};
}
function laneArt(canvas,kind){
  const ctx=canvas.getContext("2d"),dpr=Math.min(devicePixelRatio||1,2);let t=0,raf;const w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const col=kind==="pro"?"#A9C2E2":"#F3AE45";
  function draw(){ctx.clearRect(0,0,w,h);ctx.strokeStyle=col;
    if(kind==="pro"){ctx.globalAlpha=.25;for(let x=0;x<w;x+=28){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
      ctx.globalAlpha=.9;ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<=40;i++){const x=i/40*w,y=h*.85-(i/40)*h*.6-Math.sin(i*.6+t)*10;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();ctx.lineWidth=1}
    else{const bw=46,bh=20;ctx.lineWidth=1.2;for(let r=0;r*bh<h;r++){const off=r%2?bw/2:0;for(let c=-1;c*bw<w;c++){const ph=(Math.sin(t*.8+r*.5+c*.3)+1)/2;ctx.globalAlpha=.15+ph*.55;ctx.strokeRect(c*bw+off+2,h-(r+1)*bh+2,bw-4,bh-4)}}}
    ctx.globalAlpha=1}
  function loop(){t+=.02;draw();raf=requestAnimationFrame(loop)}RM?draw():loop();return()=>cancelAnimationFrame(raf);
}
const bars=(rows,cls="",drill)=>{const m=Math.max(1,...rows.map(r=>r[1]));return `<div class="bars">${rows.map(([l,v,s,k])=>`<div class="br${drill?" click":""}"${drill?` data-drill="${drill}|${esc(k??l)}" role="button" tabindex="0" title="See these vacancies"`:""}><span title="${esc(l)}">${esc(l)}</span><span class="t"><i class="${cls}" style="width:${v/m*100}%"></i></span><b class="num">${s??v}</b></div>`).join("")}</div>`};
function lineChart(pts,{h=150,max=100}={}){
  if(pts.length<1)return"";const W2=560,pad=30,ys=v=>h-20-(v/max)*(h-40),xs=i=>pad+(pts.length===1?0:i/(pts.length-1))*(W2-pad*2);
  const d=pts.map((p,i)=>`${i?"L":"M"}${xs(i).toFixed(1)},${ys(p.v).toFixed(1)}`).join(" ");

   ${[0,50,100].map(v=>`<line x1="${pad}" x2="${W2-pad}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)"/><text x="${pad-6}" y="${ys(v)+4}" text-anchor="end" font-size="10" fill="var(--dim)">${v}</text>`).join("")}
   <path d="${d} L${xs(pts.length-1)},${ys(0)} L${xs(0)},${ys(0)} Z" fill="var(--pro)" opacity=".12"/>

   ${pts.map((p,i)=>`<circle cx="${xs(i)}" cy="${ys(p.v)}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?"var(--red)":"var(--pro)"}"/><text x="${xs(i)}" y="${h-4}" text-anchor="middle" font-size="10" fill="var(--dim)">${new Date(p.at).toLocaleDateString("en-IN",{month:"short",year:"2-digit"})}</text><text x="${xs(i)}" y="${ys(p.v)-9}" text-anchor="middle" font-size="10.5" fill="var(--fg)">${p.v}</text>`).join("")}

}

   ${stepper(a)}
   ${NEXT[s]?`<div class="nextact"><b>Next:</b> ${NEXT[s]}</div>`:""}
   ${(s==="int_invited"||s==="int_rescheduled")&&iv?`<div class="box"><h4>Interview invitation</h4><dl class="icard" style="margin:0"><dt>When</dt><dd>${iv.date} · ${iv.time} · ${esc(iv.tz)}</dd><dt>Mode</dt><dd>${esc(iv.mode)}</dd><dt>Where</dt><dd>${esc(iv.where)}</dd></dl>
     <div class="acts"><button class="btn red sm" data-cact="accept">Accept</button><button class="btn sm" data-cact="resched">Request another time</button><button class="btn sm warn" data-cact="decline">Decline</button></div>
     <div id="reschedBox" hidden><label class="f"><span>Suggest times that work for you</span><input class="in" id="rsTxt" placeholder="Any weekday after 4 pm, or Saturday morning"></label><button class="btn sm" id="rsSend" style="margin-top:8px">Send request</button></div></div>`:""}
   ${s==="offer_sent"?`<div class="box"><h4>Offer</h4><p style="font-size:14px">Review the offer shared by ${esc(e.name)} in the timeline below.</p><div class="acts"><button class="btn red sm" data-cact="oaccept">Accept offer</button><button class="btn sm warn" data-cact="odecline">Decline offer</button></div></div>`:""}
   <div><h4 style="margin-bottom:12px">Timeline</h4>${timeline(a,false)}</div>
   ${FINAL.includes(s)?"":`<div class="box"><h4>${s==="info_req"||s==="assess_req"?"Reply to the employer":"Message the employer"}</h4><textarea class="in" id="cMsg" placeholder="${s==="info_req"?"Share the details they asked for":"Write a message"}"></textarea>
     <div class="acts" style="justify-content:space-between"><input type="file" id="cFile" class="in sm" style="max-width:240px"><button class="btn red sm" id="cSend">Send</button></div></div>
     <div><button class="btn sm ghost warn" id="wd">Withdraw application</button></div>`}
  </div>`}
function bindCandApp(c,a){
  const r=()=>{renderNav();myApps(c)},mb=$("#mb");
  $$("[data-cact]",mb).forEach(b=>b.onclick=()=>{const k=b.dataset.cact;
    if(k==="accept"){addEvent(a,{s:"int_scheduled",by:"cand"});toast("Interview confirmed. The employer has been notified.")}
    if(k==="decline"){addEvent(a,{kind:"resp",by:"cand",text:"Declined the interview invitation"});toast("Declined. The employer has been told.")}
    if(k==="resched"){$("#reschedBox").hidden=false;$("#rsTxt").focus();return}
    if(k==="oaccept"){addEvent(a,{s:"offer_accepted",by:"cand"});toast("Offer accepted. Congratulations!")}
    if(k==="odecline"){addEvent(a,{s:"offer_declined",by:"cand"});toast("Offer declined. The employer has been told.")}
    r()});
  $("#rsSend")&&($("#rsSend").onclick=()=>{addEvent(a,{kind:"resp",by:"cand",text:"Requested a different interview time: "+($("#rsTxt").value||"no times given")});toast("Request sent. You'll be notified of the new time.");r()});
  $("#cSend")&&($("#cSend").onclick=()=>{const t=$("#cMsg").value.trim(),f=$("#cFile").files[0];if(!t&&!f){toast("Write a message or attach a file.");return}addEvent(a,{kind:"msg",by:"cand",text:t,file:f?.name});toast("Sent to "+E(J(a.jobId).empId).name);r()});
  $("#wd")&&($("#wd").onclick=e=>{const b=e.currentTarget;if(b.dataset.c){addEvent(a,{s:"withdrawn",by:"cand"});toast("Application withdrawn.");r()}else{b.dataset.c=1;b.textContent="Tap again to confirm withdrawal"}});
}

function prefsHTML(list,obj){return `<div class="prefs">${list.map(([k,l])=>`<label><input type="checkbox" data-pref="${k}"${(obj||{})[k]===false?"":" checked"}>${l}</label>`).join("")}</div>`}
function bindPrefs(holder,who){$$("[data-pref]").forEach(x=>x.onchange=()=>{holder.nprefs=holder.nprefs||{};holder.nprefs[x.dataset.pref]=x.checked;audit(USER.role==="cand"?"candidate":"employer",who,"Notification preferences changed",`${CAT_NAME[x.dataset.pref]}: email ${x.checked?"on":"off"}`);toast(`Email for "${CAT_NAME[x.dataset.pref]}" ${x.checked?"on":"off"}. In-app updates continue.`)})}

/* ================= CAREER PATHWAY ================= */
function career(c){
  const K=c.career;
  if(!K.goals.length||editGoals){
    const libNames=Object.keys(LIB),cur=K.current||c.role;
    $("#mb").innerHTML=`<div class="plate" style="max-width:820px"><p class="eyebrow">TIN Career Pathway</p><h3>${K.goals.length?"Edit your goals":"Where do you want to be?"}</h3>
     <p class="muted">Set a goal for each horizon. Pick from common roles in the industry or type your own. For roles we know, we'll fill in the skills, experience and certifications they usually need. You can change all of it.</p>
     <datalist id="roles">${libNames.map(n=>`<option>${n}</option>`).join("")}</datalist>
     <label class="f"><span>Where you are now</span><input class="in" id="g_cur" list="roles" value="${esc(cur)}"></label>
     <div class="grid2">${HZ.map((h,i)=>`<label class="f"><span>${h}-year goal</span><input class="in" id="g_${i}" list="roles" value="${esc(K.goals[i]?.title||"")}" placeholder="${["Senior Sales Executive","Area Sales Manager","Regional Sales Manager","National Sales Head"][i]}"></label>`).join("")}</div>
     <div class="acts">${Object.entries(TRACKS).map(([k,t])=>`<button class="btn sm" data-track="${k}">Fill: ${t.ladder[0]} track</button>`).join("")}</div>
     <div class="nav2">${K.goals.length?`<button class="btn" id="gCancel">Cancel</button>`:"<span></span>"}<button class="btn red" id="gSave">Save my pathway <span class="arr">→</span></button></div></div>`;
    $$("[data-track]").forEach(b=>b.onclick=()=>{const L=TRACKS[b.dataset.track].ladder;$("#g_cur").value=L[0];HZ.forEach((h,i)=>$("#g_"+i).value=L[i+1])});
    $("#gCancel")&&($("#gCancel").onclick=()=>{editGoals=false;career(c)});
    $("#gSave").onclick=()=>{const titles=HZ.map((h,i)=>$("#g_"+i).value.trim());if(!titles[0]){toast("Set at least your 1-year goal.");$("#g_0").focus();return}
      K.current=$("#g_cur").value.trim()||c.role;
      K.goals=titles.map((t,i)=>t?(K.goals[i]?.title===t?K.goals[i]:goalFrom(t,HZ[i])):null).filter(Boolean);
      if(!K.started)K.started=Date.now();K.log.push({at:Date.now(),type:"Milestone",text:editGoals?"Updated career goals":"Created career pathway: "+K.goals.map(g=>g.title).join(" → ")});
      audit("candidate",c.name,editGoals?"Career goals updated":"Career pathway created",K.goals.map(g=>g.title).join(" → "));editGoals=false;selGoal=null;snap(c);meView()};
    return}
  const ng=nextGoal(c);if(selGoal==null||selGoal>=K.goals.length)selGoal=ng;
  const R=K.goals.map((g,i)=>readiness(c,i)),score=R[ng].total,g=K.goals[selGoal],r=R[selGoal];
  const hist=[...K.scores];const lastV=hist[hist.length-1];if(!lastV||lastV.v!==score)hist.push({at:Date.now(),v:score});
  const fillW=(()=>{let k=0;R.forEach((x,i)=>{if(x.total>=100)k=i+1});return 10+k*20+(k<4?R[k].total/100*20:0)})();
  const circ=2*Math.PI*40;
  const lv=s=>c.skills[s]||0;
  $("#mb").innerHTML=`
   <div class="cards2">
    <div class="plate"><p class="eyebrow">TIN Career Score</p>
      <div class="scorebig"><span class="v num">${score}<small>/100</small></span><div style="flex:1;min-width:180px"><p style="font-size:15px">Ready for <b>${esc(K.goals[ng].title)}</b>, your next step.</p><p class="muted" style="font-size:13.5px;margin-top:6px">Measures how prepared you are for that goal using your education, experience, skills, certifications, exposure and progression. Tap "How it's calculated" below.</p></div></div>
      <p class="disclaim">An indicator to guide your development. It is not a measure of your worth or a guarantee of any job or promotion.</p></div>
    <div class="plate"><p class="eyebrow">Your progress over time</p>${lineChart(hist)}<p class="dim" style="font-size:12.5px">History is kept. Every update adds a point instead of overwriting the last one.</p></div>
   </div>
   <div class="plate"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><p class="eyebrow">Your pathway · tap a step</p><button class="btn sm" id="gEdit">Edit goals</button></div>
    <div class="pathway"><div class="pw"><span class="fill" style="width:${Math.min(80,fillW-10)}%"></span>
     <button class="node here" title="You are here"><svg viewBox="0 0 96 96"><circle class="ring-bg" cx="48" cy="48" r="40"/><text class="pct" x="48" y="56" text-anchor="middle" fill="#fff">NOW</text></svg><span class="hz">You are here</span><b>${esc(K.current)}</b><span class="dim num" style="font-size:12px">${c.exp} yrs</span></button>
     ${K.goals.map((x,i)=>`<button class="node ${i===selGoal?"sel":""}" data-g="${i}"><svg viewBox="0 0 96 96"><circle class="ring-bg" cx="48" cy="48" r="40"/><circle class="ring" cx="48" cy="48" r="40" stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-R[i].total/100)}" ${R[i].total>=100?'style="stroke:var(--ok)"':""}/><text class="pct num" x="48" y="56" text-anchor="middle">${R[i].total}%</text></svg><span class="hz">${x.h}-year goal</span><b>${esc(x.title)}</b><span class="dim" style="font-size:12px">${x.exp}+ yrs</span></button>`).join("")}
    </div></div></div>
   <div class="plate">
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:end"><div><p class="eyebrow">${g.h}-year goal</p><h3>${esc(g.title)}</h3></div><span class="pill ${r.total>=100?"g":r.total>=60?"n":"w"}">Readiness ${r.total}%</span></div>
    <div class="legend"><span><span class="sk l2" style="padding:0;border:0;background:none"></span>Have it</span><span><span class="sk l1" style="padding:0;border:0;background:none"></span>Developing</span><span><span class="sk l0" style="padding:0;border:0;background:none"></span>To learn</span><span class="dim">Tap a skill to update your level</span></div>
    <div class="gapcols">${["functional","technical","management","industry"].map(cat=>{const rs=g.reqs.filter(x=>x[1]===cat);if(!rs.length)return"";return `<div class="box"><h4>${CAT_L[cat]}</h4><div class="skills">${rs.map(([s])=>`<button class="sk l${lv(s)}" data-sk="${esc(s)}">${esc(s)}</button>`).join("")}</div></div>`}).join("")}
     <div class="box"><h4>Add a requirement</h4><div class="acts"><input class="in sm" id="nrS" placeholder="Skill" style="flex:1;min-width:120px"><select class="in sm" id="nrC">${Object.entries(CAT_L).map(([k,l])=>`<option value="${k}">${l}</option>`).join("")}</select><button class="btn sm" id="nrAdd">Add</button></div></div></div>
    <div class="gapcols">
     <div class="box"><h4>Experience &amp; education</h4>
       <div><div style="display:flex;justify-content:space-between;font-size:13.5px"><span>Experience</span><span class="num">${c.exp} / ${g.exp} yrs</span></div><div class="meter"><i style="width:${Math.min(100,c.exp/g.exp*100)}%"></i></div></div>
       <div><div style="display:flex;justify-content:space-between;font-size:13.5px"><span>Education</span><span>${EDU[c.edu]} → ${EDU[g.edu]}</span></div><div class="meter"><i style="width:${Math.min(100,(c.edu+1)/(g.edu+1)*100)}%"></i></div></div></div>
     <div class="box"><h4>Recommended exposure</h4>${g.exposure.length?g.exposure.map(x=>`<label class="chk"><input type="checkbox" data-ex="${esc(x)}"${K.exposure[x]?" checked":""}>${esc(x)}</label>`).join(""):`<p class="dim" style="font-size:13.5px">None listed for this role.</p>`}</div>
    </div>
    <div class="box"><h4>Education &amp; qualifications for this step</h4>${g.certs.length?g.certs.map(q=>`<div class="qual"><span>${esc(q)}<small>Needed for ${esc(g.title)}</small></span><select class="in sm" data-q="${esc(q)}">${QST.map(([k,l])=>`<option value="${k}"${(K.quals[q]||"not_started")===k?" selected":""}>${l}</option>`).join("")}</select></div>`).join(""):`<p class="dim" style="font-size:13.5px">No specific certifications for this role.</p>`}</div>
    <details class="box" id="howcalc"><summary><h4>How it's calculated</h4></summary>
      <p class="muted" style="font-size:13.5px">Each part is scored 0–100% against what ${esc(g.title)} needs, then weighted. Parts the role doesn't use are left out and the rest scale up. Skill levels count as: have it = 1, developing = 0.5, to learn = 0. No AI is involved, so the same inputs always give the same score.</p>
      <div class="tbl-wrap"><table class="tbl" style="min-width:560px"><thead><tr><th>Part</th><th>Weight</th><th>Your position</th><th>Progress</th><th>Points</th></tr></thead><tbody>
       ${r.parts.map(p=>`<tr><td>${p.l}</td><td class="num">${p.w}</td><td class="muted">${esc(p.d)}</td><td style="width:120px"><div class="meter"><i style="width:${p.f*100}%"></i></div></td><td class="num">${(p.w*p.f/r.tw*100).toFixed(1)}</td></tr>`).join("")}
       <tr><td><b>Readiness</b></td><td class="num">${r.tw}</td><td></td><td></td><td class="num"><b>${r.total}</b></td></tr></tbody></table></div></details>
   </div>
   <div class="cards2">
    <div class="plate"><p class="eyebrow">Recommended next</p>
      ${(()=>{const gaps=g.reqs.filter(([s])=>lv(s)<2).sort((a,b)=>lv(a[0])-lv(b[0])).slice(0,4),qs=g.certs.filter(q=>K.quals[q]!=="completed").slice(0,2),ex=g.exposure.filter(x=>!K.exposure[x]).slice(0,1);
        return `<div class="pts">${gaps.map(([s,cat])=>`<div class="pt"><span class="k">→</span><div><b>${lv(s)?"Strengthen":"Learn"}: ${esc(s)}</b><p>${CAT_L[cat]}</p></div></div>`).join("")}${qs.map(q=>`<div class="pt"><span class="k">→</span><div><b>${K.quals[q]==="in_progress"?"Finish":"Plan"}: ${esc(q)}</b><p>Certification</p></div></div>`).join("")}${ex.map(x=>`<div class="pt"><span class="k">→</span><div><b>Get exposure: ${esc(x)}</b><p>Ask your manager for this responsibility</p></div></div>`).join("")}${!gaps.length&&!qs.length&&!ex.length?`<p class="muted">You meet everything listed for this step. Look at your next goal.</p>`:""}</div>`})()}
      <p class="disclaim">Courses, certifications and training partners will be suggested here in a later release. Nothing to pay today.</p></div>
    <div class="plate"><p class="eyebrow">Log your progress</p>
      <div class="grid2"><label class="lab">Type<select class="in" id="lgT">${LOGT.map(t=>`<option>${t}</option>`).join("")}</select></label><label class="lab">Date<input class="in" type="date" id="lgD" value="${new Date().toISOString().slice(0,10)}"></label></div>

      <button class="btn red" id="lgAdd" style="align-self:start">Add to my history</button>
      <div class="log">${[...K.log].sort((a,b)=>b.at-a.at).slice(0,8).map(x=>`<div><time>${fmtD(x.at)}</time><span class="chip">${esc(x.type)}</span><span>${esc(x.text)}</span></div>`).join("")}</div></div>
   </div>`;
  const upd=(type,text)=>{K.log.push({at:Date.now(),type,text});audit("candidate",c.name,"Career pathway updated",text);snap(c);career(c)};
  $$("[data-g]").forEach(b=>b.onclick=()=>{selGoal=+b.dataset.g;career(c)});
  $("#gEdit").onclick=()=>{editGoals=true;career(c)};
  $$("[data-sk]").forEach(b=>b.onclick=()=>{const s=b.dataset.sk,n=(lv(s)+1)%3;c.skills[s]=n;upd("Skill acquired",`${s}: ${["to learn","developing","have it"][n]}`);toast(`${s} → ${["to learn","developing","have it"][n]}`)});
  $$("[data-ex]").forEach(x=>x.onchange=()=>{K.exposure[x.dataset.ex]=x.checked;upd("Milestone",(x.checked?"Achieved: ":"Unmarked: ")+x.dataset.ex)});
